name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate contact card assets
        run: npm run card:assets

      - name: Generate signed wallet passes
        env:
          APPLE_PASS_TYPE_IDENTIFIER: ${{ secrets.APPLE_PASS_TYPE_IDENTIFIER }}
          APPLE_TEAM_IDENTIFIER: ${{ secrets.APPLE_TEAM_IDENTIFIER }}
          APPLE_WWDR_CERTIFICATE: ${{ secrets.APPLE_WWDR_CERTIFICATE }}
          APPLE_SIGNER_CERTIFICATE: ${{ secrets.APPLE_SIGNER_CERTIFICATE }}
          APPLE_SIGNER_KEY: ${{ secrets.APPLE_SIGNER_KEY }}
          APPLE_SIGNER_KEY_PASSPHRASE: ${{ secrets.APPLE_SIGNER_KEY_PASSPHRASE }}
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_WALLET_CREDENTIALS: ${{ secrets.GOOGLE_WALLET_CREDENTIALS }}
        run: npm run wallet:generate

      - name: Build with Astro
        run: npm run build

      - name: Verify private contact card
        run: npm run card:verify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Verify deployed contact card
        run: node scripts/verify-card-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
